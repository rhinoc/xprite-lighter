<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@xprite/lighter demo</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; background: #17181d; color: #ddd; margin: 24px; }
      h1 { font-size: 18px; }
      .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
      figure { margin: 0; }
      figcaption { color: #9aa; margin-top: 6px; }
      canvas, img { image-rendering: pixelated; width: 400px; background: #232530; }
      label { display: block; margin: 12px 0 4px; }
      input[type="range"] { width: 300px; }
    </style>
  </head>
  <body>
    <h1>@xprite/lighter — relight demo</h1>
    <p>
      Sprite: the Shadow Boss from “10 More Fantasy RPG Enemies Plus a Boss —
      Normal Map” by Antifarea,
      <a href="https://opengameart.org/content/10-more-fantasy-rpg-enemies-plus-a-boss-normal-map">OpenGameArt</a>,
      CC-BY 3.0. Left: the pack's authored normal maps. Right: normals generated by
      <code>generateNormalMap</code> from the flat render. Drag to orbit the light.
    </p>
    <label>Light azimuth <span id="deg">0</span>°</label>
    <input id="az" type="range" min="0" max="23" value="0" step="1" />
    <div class="row">
      <figure>
        <img id="authored" src="out/relit-authored.gif" alt="authored normals relit" />
        <figcaption>Authored normals</figcaption>
      </figure>
      <figure>
        <img id="generated" src="out/relit-generated.gif" alt="generated normals relit" />
        <figcaption>@xprite/lighter normals</figcaption>
      </figure>
      <figure>
        <img src="out/albedo-boss.png" alt="flat render" />
        <figcaption>Flat input</figcaption>
      </figure>
      <figure>
        <img src="out/normals-generated-boss.png" alt="generated normal map" />
        <figcaption>Generated map</figcaption>
      </figure>
    </div>
    <script>
      const az = document.getElementById("az");
      const deg = document.getElementById("deg");
      const pad = (i) => String(i).padStart(2, "0");
      az.addEventListener("input", () => {
        const i = az.value;
        deg.textContent = Math.round((i / 24) * 360);
        document.getElementById("authored").src = `out/relit-authored-${pad(i)}.png`;
        document.getElementById("generated").src = `out/relit-generated-${pad(i)}.png`;
      });
    </script>
  </body>
</html>
