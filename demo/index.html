<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@xprite/lighter demo</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; background: #17181d; color: #ddd; margin: 24px; }
      h1 { font-size: 18px; }
      .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
      figure { margin: 0; }
      figcaption { color: #9aa; margin-top: 6px; }
      canvas, img { image-rendering: pixelated; width: 400px; background: #232530; }
      label { display: block; margin: 12px 0 4px; }
      input[type="range"] { width: 300px; }
    </style>
  </head>
  <body>
    <h1>@xprite/lighter — relight demo</h1>
    <p>
      Sprite: the Shadow Boss from “10 More Fantasy RPG Enemies Plus a Boss —
      Normal Map” by Antifarea,
      <a href="https://opengameart.org/content/10-more-fantasy-rpg-enemies-plus-a-boss-normal-map">OpenGameArt</a>,
      CC-BY 3.0. Left: the pack's authored normal maps. Right: normals generated by
      <code>generateNormalMap</code> from the flat render. Drag to orbit the light.
    </p>
    <label>Light azimuth <span id="deg">0</span>°</label>
    <input id="az" type="range" min="0" max="359" value="0" step="1" />
    <label>Light elevation <span id="el">55</span>°</label>
    <input id="elev" type="range" min="15" max="85" value="55" step="1" />
    <div class="row">
      <figure>
        <canvas id="authored" width="336" height="108"></canvas>
        <figcaption>Authored normals</figcaption>
      </figure>
      <figure>
        <canvas id="generated" width="336" height="108"></canvas>
        <figcaption>@xprite/lighter normals</figcaption>
      </figure>
      <figure>
        <canvas id="albedo" width="336" height="108"></canvas>
        <figcaption>Flat input</figcaption>
      </figure>
      <figure>
        <canvas id="normals" width="336" height="108"></canvas>
        <figcaption>Generated map</figcaption>
      </figure>
    </div>
    <script type="module">
      import {
        generateNormalMap,
        prepareNormalMapLighting,
        renderPreparedNormalMapLighting,
      } from "../dist/index.js";

      const CROP = { x: 4, y: 1004, w: 336, h: 108 };

      const loadPixels = async (url) => {
        const bitmap = await createImageBitmap(await (await fetch(url)).blob());
        const canvas = new OffscreenCanvas(bitmap.width, bitmap.height);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(bitmap, 0, 0);
        const { data, width, height } = ctx.getImageData(0, 0, bitmap.width, bitmap.height);
        return { width, height, data };
      };

      const crop = ({ width, data }) => {
        const out = new Uint8ClampedArray(CROP.w * CROP.h * 4);
        for (let y = 0; y < CROP.h; y++) {
          const src = ((CROP.y + y) * width + CROP.x) * 4;
          out.set(data.subarray(src, src + CROP.w * 4), y * CROP.w * 4);
        }
        return { width: CROP.w, height: CROP.h, data: out };
      };

      const show = (id, { width, height, data }) => {
        const canvas = document.getElementById(id);
        canvas.width = width;
        canvas.height = height;
        canvas
          .getContext("2d")
          .putImageData(new ImageData(new Uint8ClampedArray(data), width, height), 0, 0);
      };

      const albedo = crop(await loadPixels("assets/oga-10-monsters-render-cutout.png"));
      const authored = crop(await loadPixels("assets/oga-10-monsters-normals-cutout.png"));
      const generated = crop(generateNormalMap(albedo, { preset: "object" }));

      show("albedo", albedo);
      show("normals", generated);

      const prepared = {
        authored: prepareNormalMapLighting(albedo, authored),
        generated: prepareNormalMapLighting(albedo, generated),
      };

      const az = document.getElementById("az");
      const elev = document.getElementById("elev");
      const render = () => {
        document.getElementById("deg").textContent = az.value;
        document.getElementById("el").textContent = elev.value;
        const azimuth = (az.value * Math.PI) / 180;
        const elevation = (elev.value * Math.PI) / 180;
        const radius = Math.cos(elevation);
        const options = {
          position: {
            x: albedo.width / 2 + (Math.cos(azimuth) * radius * albedo.width) / 2,
            y: albedo.height / 2 - (Math.sin(azimuth) * radius * albedo.height) / 2,
          },
          height: 60 + 60 * Math.sin(elevation),
          brightness: 380,
          ambient: 10,
          maskStrength: 100,
          color: [255, 244, 224, 255],
          invertY: false,
        };
        show("authored", renderPreparedNormalMapLighting(prepared.authored, options));
        show("generated", renderPreparedNormalMapLighting(prepared.generated, options));
      };
      az.addEventListener("input", render);
      elev.addEventListener("input", render);
      render();
    </script>
  </body>
</html>
