<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@xprite/lighter demo</title>
    <style>
      :root { color-scheme: dark; }
      body { font: 14px/1.5 system-ui, sans-serif; background: #17181d; color: #ddd; margin: 24px; }
      h1 { font-size: 18px; margin-bottom: 4px; }
      p.note { color: #9aa; margin: 0 0 14px; max-width: 80ch; }
      .toolbar { display: flex; gap: 18px; flex-wrap: wrap; align-items: end; margin-bottom: 16px; }
      .control { display: grid; gap: 4px; }
      .control span { font-size: 12px; color: #9aa; }
      select, button, input[type="range"] { font: inherit; }
      select { background: #232530; color: #ddd; border: 1px solid #3a3d4a; border-radius: 4px; padding: 5px 8px; min-width: 280px; }
      input[type="range"] { width: 170px; }
      table { border-collapse: collapse; }
      th { text-align: left; font-size: 12px; color: #9aa; font-weight: 600; padding: 0 14px 6px 0; }
      td { vertical-align: middle; padding: 4px 14px 4px 0; }
      td.score { font: 12px ui-monospace, monospace; color: #9aa; white-space: nowrap; }
      td.score.best { color: #74d6bc; font-weight: 700; }
      td.name { font-size: 12px; color: #9aa; white-space: nowrap; padding-right: 18px; }
      td.name b { color: #ddd; display: block; font-size: 13px; }
      .well { background: #232530; border: 1px solid #3a3d4a; border-radius: 6px; display: inline-grid; place-items: center; min-width: 40px; min-height: 40px; }
      canvas { image-rendering: pixelated; display: block; }
      .credit { margin-top: 16px; color: #9aa; font-size: 12px; }
      .credit a { color: #74d6bc; }
    </style>
  </head>
  <body>
    <h1>@xprite/lighter — method comparison</h1>
    <p class="note">
      Same input + same light for every row. "GT" uses the case's ground-truth or
      published normal map; each competitor row generates normals from the input
      alone. Drag the light to compare.
    </p>
    <div class="toolbar">
      <label class="control">
        <span>Case</span>
        <select id="case"></select>
      </label>
      <div class="control">
        <span>Light azimuth <b id="azv">35</b>° · elevation <b id="elv">55</b>°</span>
        <div style="display:flex;gap:10px">
          <input id="az" type="range" min="0" max="359" value="35" />
          <input id="el" type="range" min="15" max="85" value="55" />
        </div>
      </div>
    </div>

    <table>
      <thead>
        <tr><th></th><th>Input</th><th>Normal</th><th>Lit</th><th>∠err°</th><th>relit MAE</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <p class="credit" id="credit"></p>

    <script type="module">
      import {
        generateNormalMap,
        prepareNormalMapLighting,
        renderPreparedNormalMapLighting,
      } from "../dist/index.js";
      import { spriteLabNormalMap } from "../bench/competitors/spritelab.mjs";
      import { palNormalMap } from "../bench/competitors/pal-upstream.mjs";
      import { bumpItNormalMap } from "../bench/competitors/bumpit.mjs";
      import { laigterNormalMap } from "../bench/competitors/laigter.mjs";

      const el = (id) => document.getElementById(id);
      const manifest = await (await fetch("bench-cases/manifest.json")).json();
      const cases = [
        {
          id: "oga-10-monsters",
          title: "oga-10-monsters (Antifarea · CC-BY 3.0)",
          author: "Antifarea",
          license: "CC-BY-3.0",
          source_url:
            "https://opengameart.org/content/10-more-fantasy-rpg-enemies-plus-a-boss-normal-map",
          license_url: "https://creativecommons.org/licenses/by/3.0/",
          input: "assets/oga-10-monsters-render-cutout.png",
          gt: "assets/oga-10-monsters-normals-cutout.png",
        },
        ...manifest.cases.map((c) => ({
          ...c,
          input: `bench-cases/${c.id}/input.png`,
          gt: `bench-cases/${c.id}/gt/normal.png`,
        })),
      ];

      const METHODS = [
        { id: "gt", label: "GT", sub: "ground truth", normal: null },
        { id: "xprite", label: "Xprite", sub: "object preset", normal: (src) => generateNormalMap(src, { preset: "object" }) },
        { id: "pal", label: "Pixel Art Lighter", sub: "v3.5.24 upstream", normal: (src) => palNormalMap(src, "object") },
        { id: "spritelab", label: "SpriteLab", sub: "defaults", normal: (src) => spriteLabNormalMap(src) },
        { id: "bumpit", label: "Bump It", sub: "verbatim NS engine", normal: (src) => bumpItNormalMap(src) },
        { id: "laigter", label: "Laigter", sub: "headless port · GUI defaults", normal: (src) => laigterNormalMap(src) },
      ];

      // Per-case mesh-GT bench scores. Method key -> {angle, relit} for the
      // active case; GT is 0 by definition. spritefusion has no browser build,
      // so it joins the score columns without a normals row.
      const perCase = await (await fetch("bench-scores/per-case.json")).json();

      const loadPixels = async (url) => {
        const bitmap = await createImageBitmap(await (await fetch(url)).blob());
        const canvas = new OffscreenCanvas(bitmap.width, bitmap.height);
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(bitmap, 0, 0);
        const { data, width, height } = ctx.getImageData(0, 0, bitmap.width, bitmap.height);
        return { width, height, data };
      };

      const show = (canvas, { width, height, data }) => {
        canvas.width = width;
        canvas.height = height;
        canvas
          .getContext("2d")
          .putImageData(new ImageData(new Uint8ClampedArray(data), width, height), 0, 0);
      };

      const SCORED = [...METHODS.map((m) => m.id), "spritefusion"];
      const rows = METHODS.map((m) => {
        const tr = document.createElement("tr");
        const name = document.createElement("td");
        name.className = "name";
        name.innerHTML = `<b>${m.label}</b>${m.sub}`;
        tr.appendChild(name);
        const cells = {};
        for (const key of ["input", "normal", "lit"]) {
          const td = document.createElement("td");
          const well = document.createElement("div");
          well.className = "well";
          const canvas = document.createElement("canvas");
          well.appendChild(canvas);
          td.appendChild(well);
          tr.appendChild(td);
          cells[key] = canvas;
        }
        for (const key of ["angle", "relit"]) {
          const td = document.createElement("td");
          td.className = "score";
          td.dataset.metric = key;
          tr.appendChild(td);
        }
        tr.dataset.method = m.id;
        el("rows").appendChild(tr);
        return { method: m, cells, prepared: null, normal: null };
      });

      // Extra score-only row for spritefusion (CLI only, no browser build).
      {
        const tr = document.createElement("tr");
        tr.dataset.method = "spritefusion";
        const name = document.createElement("td");
        name.className = "name";
        name.innerHTML = "<b>Sprite Fusion</b>CLI · no browser build";
        tr.appendChild(name);
        for (let i = 0; i < 3; i++) tr.appendChild(document.createElement("td"));
        for (const key of ["angle", "relit"]) {
          const td = document.createElement("td");
          td.className = "score";
          td.dataset.metric = key;
          tr.appendChild(td);
        }
        el("rows").appendChild(tr);
      }

      const state = { index: 0 };
      const current = () => cases[state.index];

      const scoreKey = (id) => ({ xprite: "object", pal: "pal-upstream" })[id] ?? id;

      function updateScores() {
        const c = current();
        const scores = perCase[c.id] ?? {};
        let bestAngle = Infinity, bestRelit = Infinity;
        for (const id of SCORED) {
          if (id === "gt") continue;
          const s = scores[scoreKey(id)];
          if (!s) continue;
          if (s.angle < bestAngle) bestAngle = s.angle;
          if (s.relit < bestRelit) bestRelit = s.relit;
        }
        for (const tr of el("rows").children) {
          const id = tr.dataset.method;
          for (const td of tr.querySelectorAll("td.score")) {
            const metric = td.dataset.metric;
            const s = id === "gt" ? { angle: 0, relit: 0 } : scores[scoreKey(id)];
            td.textContent = s ? s[metric].toFixed(2) : "—";
            td.classList.toggle(
              "best",
              !!s &&
                ((metric === "angle" && s.angle === bestAngle) ||
                  (metric === "relit" && s.relit === bestRelit)),
            );
          }
        }
      }

      async function loadCase() {
        const c = current();
        const src = await loadPixels(c.input);
        const gt = await loadPixels(c.gt).catch(() => null);
        for (const row of rows) {
          row.normal = row.method.id === "gt" ? gt : row.method.normal(src);
          row.prepared = row.normal ? prepareNormalMapLighting(src, row.normal) : null;
          show(row.cells.input, src);
        }
        const scale = Math.max(1, Math.floor(220 / Math.max(src.width, src.height)));
        for (const row of rows) row.cells.input.style.width = `${src.width * scale}px`;
        for (const row of rows) {
          if (row.normal) row.cells.normal.style.width = `${row.normal.width * scale}px`;
          row.cells.lit.style.width = `${src.width * scale}px`;
        }
        el("credit").innerHTML = `${c.author} · ${c.license} · <a href="${c.source_url}">source ↗</a>${
          c.license_url ? ` · <a href="${c.license_url}">license ↗</a>` : ""
        }`;
        render();
        updateScores();
      }

      function render() {
        const c = current();
        const az = (+el("az").value * Math.PI) / 180;
        const elev = (+el("el").value * Math.PI) / 180;
        el("azv").textContent = el("az").value;
        el("elv").textContent = el("el").value;
        for (const row of rows) {
          if (!row.normal) continue;
          show(row.cells.normal, row.normal);
          const radius = Math.cos(elev);
          const w = row.prepared.width;
          const h = row.prepared.height;
          const options = {
            position: {
              x: w / 2 + (Math.cos(az) * radius * w) / 2,
              y: h / 2 - (Math.sin(az) * radius * h) / 2,
            },
            height: 40 + 60 * Math.sin(elev),
            brightness: 360,
            ambient: 14,
            maskStrength: 100,
            color: [255, 244, 224, 255],
            invertY: false,
          };
          show(row.cells.lit, renderPreparedNormalMapLighting(row.prepared, options));
        }
      }

      const picker = el("case");
      for (const [i, c] of cases.entries()) {
        const option = document.createElement("option");
        option.value = i;
        option.textContent = c.title ?? c.id;
        picker.appendChild(option);
      }
      picker.addEventListener("change", () => {
        state.index = +picker.value;
        loadCase();
      });
      el("az").addEventListener("input", render);
      el("el").addEventListener("input", render);

      loadCase();
    </script>
  </body>
</html>
